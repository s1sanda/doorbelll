<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doorbell Phone Proxy</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 20px; background: #111; color: #fff; }
        button { background: #007AFF; color: white; border: none; padding: 18px 32px; font-size: 20px; border-radius: 12px; cursor: pointer; width: 80%; max-width: 300px; margin: 15px 0; }
        button.active { background: #34C759; }
        #status { font-size: 18px; margin: 15px 0; font-weight: 600; color: #ffcc00; }
        #log { background: #222; color: #00ffcc; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 12px; text-align: left; height: 120px; overflow-y: auto; margin-top: 20px; }
        .meter { width: 100%; height: 24px; background: #333; border-radius: 12px; overflow: hidden; margin-top: 15px; }
        #level { width: 0%; height: 100%; background: #007AFF; transition: width 0.05s linear; }
    </style>
</head>
<body>

    <h2>Doorbell Phone Listener</h2>
    <p>Place phone near the chime speaker.</p>
    
    <button id="startBtn" onclick="initListener()">Start Listening</button>
    <div id="status">Status: Waiting to start...</div>
    
    <div class="meter"><div id="level"></div></div>

    <h3>Debug Log</h3>
    <div id="log">Ready.<br></div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('log');
            if (logBox) {
                logBox.innerHTML += `> ${msg}<br>`;
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        async function initListener() {
            log("Button clicked!");
            try {
                // Request Notification Permission First
                if ("Notification" in window && Notification.permission !== "granted") {
                    await Notification.requestPermission();
                }

                log("Requesting mic access...");
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log("Mic granted!");

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                
                audioCtx.createMediaStreamSource(stream).connect(analyser);

                const btn = document.getElementById("startBtn");
                btn.textContent = "Listening Active";
                btn.className = "active";
                document.getElementById("status").textContent = "Status: Monitoring...";
                log("Listening loop initialized.");

                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function loop() {
                    analyser.getByteFrequencyData(dataArray);
                    let maxVal = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        if (dataArray[i] > maxVal) maxVal = dataArray[i];
                    }
                    
                    const meter = document.getElementById("level");
                    if (meter) {
                        meter.style.width = Math.min(100, Math.round((maxVal / 255) * 100)) + "%";
                    }
                    
                    // Threshold check (adjust if needed)
                    if (maxVal > 160) {
                        log("CHIME DETECTED! Peak: " + maxVal);
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification("Doorbell Ring! 🔔", { body: "Chime heard by phone proxy." });
                        }
                    }
                    requestAnimationFrame(loop);
                }
                loop();

            } catch (err) {
                log("ERROR: " + err.message);
                alert("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
